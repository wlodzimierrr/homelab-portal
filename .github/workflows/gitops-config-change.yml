name: GitOps Config Change

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to mutate through GitOps"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      service_id:
        description: "Service whose deployment patch should be updated"
        required: true
        type: choice
        options:
          - homelab-api
          - homelab-web
      replicas:
        description: "Desired replica count"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gitops-config-change-${{ inputs.target_environment }}-${{ inputs.service_id }}
  cancel-in-progress: false

env:
  GITOPS_REPO: wlodzimierrr/homelab-workloads
  PORTAL_DEPLOYMENT_API_URL: ${{ secrets.PORTAL_DEPLOYMENT_API_URL }}
  PORTAL_DEPLOYMENT_API_TOKEN: ${{ secrets.PORTAL_DEPLOYMENT_API_TOKEN }}

jobs:
  create-config-change-pr:
    name: Create Config Change PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_ENV: ${{ inputs.target_environment }}
      SERVICE_ID: ${{ inputs.service_id }}
      DESIRED_REPLICAS: ${{ inputs.replicas }}
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.HOMELAB_WORKLOADS_REPO_TOKEN }}
          path: homelab-workloads

      - name: Resolve target patch and apply replica change
        id: update_patch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if ! echo "$DESIRED_REPLICAS" | grep -Eq '^[0-9]+$'; then
            echo "Replica count must be a non-negative integer."
            exit 1
          fi

          if [ "$SERVICE_ID" != "homelab-api" ] && [ "$SERVICE_ID" != "homelab-web" ]; then
            echo "Unsupported service_id: $SERVICE_ID"
            exit 1
          fi

          patch_path="homelab-workloads/apps/$SERVICE_ID/envs/$TARGET_ENV/patch-deployment.yaml"
          if [ ! -f "$patch_path" ]; then
            echo "Missing deployment patch: $patch_path"
            exit 1
          fi

          current_replicas=$(sed -nE 's/^[[:space:]]*replicas:[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' "$patch_path" | head -n1)
          if [ -z "$current_replicas" ]; then
            echo "Could not read current replicas from $patch_path"
            exit 1
          fi

          current_image_ref=$(sed -nE "s#.*image:[[:space:]]*(ghcr\\.io/${OWNER}/${SERVICE_ID}:[^[:space:]]+).*#\\1#p" "$patch_path" | head -n1)
          if [ -z "$current_image_ref" ]; then
            echo "Could not read current image ref from $patch_path"
            exit 1
          fi

          sed -E -i "s#(^[[:space:]]*replicas:[[:space:]]*).+#\\1${DESIRED_REPLICAS}#" "$patch_path"

          changed_files=$(git -C homelab-workloads diff --name-only)
          if [ -z "$changed_files" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No change detected after applying replicas=${DESIRED_REPLICAS}"
            exit 0
          fi

          if [ "$changed_files" != "apps/$SERVICE_ID/envs/$TARGET_ENV/patch-deployment.yaml" ]; then
            echo "Unexpected changed files:"
            echo "$changed_files"
            exit 1
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "patch_path=$patch_path" >> "$GITHUB_OUTPUT"
          echo "current_replicas=$current_replicas" >> "$GITHUB_OUTPUT"
          echo "current_image_ref=$current_image_ref" >> "$GITHUB_OUTPUT"
          echo "branch_name=automation/${TARGET_ENV}-config-change-${SERVICE_ID}-replicas-${DESIRED_REPLICAS}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

          git -C homelab-workloads diff -- "apps/$SERVICE_ID/envs/$TARGET_ENV/patch-deployment.yaml"

      - name: Explain no-op
        if: steps.update_patch.outputs.updated != 'true'
        run: echo "Requested replica count already matches the target overlay; nothing to change."

      - name: Create PR in GitOps repo
        if: steps.update_patch.outputs.updated == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.HOMELAB_WORKLOADS_REPO_TOKEN }}
          path: homelab-workloads
          branch: ${{ steps.update_patch.outputs.branch_name }}
          delete-branch: true
          title: "chore(${{ env.TARGET_ENV }}): set ${{ env.SERVICE_ID }} replicas to ${{ env.DESIRED_REPLICAS }}"
          commit-message: "chore(${{ env.TARGET_ENV }}): set ${{ env.SERVICE_ID }} replicas to ${{ env.DESIRED_REPLICAS }}"
          body: |
            Automated GitOps config change request.

            - Service: `${{ env.SERVICE_ID }}`
            - Target environment: `${{ env.TARGET_ENV }}`
            - Change: `replicas -> ${{ env.DESIRED_REPLICAS }}`
            - Previous replicas: `${{ steps.update_patch.outputs.current_replicas }}`
            - Current image: `${{ steps.update_patch.outputs.current_image_ref }}`
            - Triggered by: `${{ github.actor }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Record config change request in portal backend
        if: steps.update_patch.outputs.updated == 'true'
        env:
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          if [ -z "${PORTAL_DEPLOYMENT_API_URL:-}" ] || [ -z "${PORTAL_DEPLOYMENT_API_TOKEN:-}" ]; then
            echo "Skipping deployment record write; PORTAL_DEPLOYMENT_API_URL or PORTAL_DEPLOYMENT_API_TOKEN is not configured."
            exit 0
          fi

          api_url="${PORTAL_DEPLOYMENT_API_URL%/}/deployments"

          cat <<EOF >/tmp/deployment-record.json
          {
            "serviceId": "${SERVICE_ID}",
            "env": "${TARGET_ENV}",
            "action": "config-change",
            "status": "pending",
            "gitPrUrl": "${PR_URL}",
            "gitPrNumber": ${PR_NUMBER},
            "imageRef": "${{ steps.update_patch.outputs.current_image_ref }}",
            "argoApp": "${SERVICE_ID}-${TARGET_ENV}",
            "gitRef": "${{ steps.update_patch.outputs.branch_name }}",
            "deployReason": "GitHub config-change request: set replicas to ${DESIRED_REPLICAS}",
            "requestKey": "gitops-pr:${PR_NUMBER}:${SERVICE_ID}:${TARGET_ENV}:config-change",
            "metadata": {
              "source": "gitops-config-change.yml",
              "workflowRunId": "${GITHUB_RUN_ID}",
              "workflowRunUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "gitopsRepo": "${GITOPS_REPO}",
              "replicas": ${DESIRED_REPLICAS},
              "previousReplicas": ${{ steps.update_patch.outputs.current_replicas }}
            }
          }
          EOF

          if ! curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${PORTAL_DEPLOYMENT_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @/tmp/deployment-record.json \
            "${api_url}"; then
            echo "Portal deployment API write failed; backend reconciler will backfill from GitOps PR metadata."
          fi
