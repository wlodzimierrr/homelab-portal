[project]
name = "homelab-backend"
version = "0.1.0"
description = "Homelab API backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "prometheus-client==0.23.1",
  "psycopg[binary]==3.2.12",
  "sqlalchemy==2.0.44",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# app/main.py is an intentional re-export hub: every name imported there is
# kept in the module's namespace so tests can monkeypatch app.main.<name>.
# F401 (imported but unused) is suppressed file-wide for that reason.
per-file-ignores = {"app/main.py" = ["F401"]}
